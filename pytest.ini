[pytest]
testpaths = tests
addopts = -ra --html=reports/report.html --self-contained-html
markers =
    smoke: critical booking journey tests
    auth: authentication tests
    create: booking creation tests
    read: booking retrieval tests
    update: booking update tests
    delete: booking cancellation tests
    negative: invalid-input and unhappy-path tests
    risk_high: high-risk regression tests
